version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
      # One weekly PR for every major bump, direct or transitive, so each lands with one CI run.
      python-major:
        update-types: [major]
    ignore:
      # The bundled MCP demo agent uses mcp 1.x's FastMCP; port it before taking mcp 2.
      - dependency-name: mcp
        update-types: [version-update:semver-major]
