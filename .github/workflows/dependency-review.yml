name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          config-file: amazon-ospo/dependency-review-config/default/dependency-review-config.yml@main
          # Licenses the OSPO list does not name, both permissive and neither bundled in the wheel:
          # pillow is MIT-CMU (OSI-approved) and arrives only through optional extras;
          # typing-extensions is Python-2.0.1, the PSF license (the list allows Python-2.0).
          allow-dependencies-licenses: pkg:pypi/pillow, pkg:pypi/typing-extensions
