name: Bug report
description: Report something that isn't working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can; specific steps get a faster fix.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. How you installed it (a checkout with `uv sync`, `just install`, or a wheel from `uv build`)
        2. calibrated-agent-evaluation ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: textarea
    id: doctor
    attributes:
      label: "calibrated-agent-evaluation doctor output"
      description: Paste the output of `calibrated-agent-evaluation doctor` (your Python, the installed extras and the configured store).
      render: text
  - type: input
    id: version
    attributes:
      label: Calibrated Agent Evaluation version
      description: Output of `calibrated-agent-evaluation --version`.
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
