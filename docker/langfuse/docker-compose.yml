# Modified from Langfuse's docker-compose.yml (MIT): ports bound to 127.0.0.1; see THIRD-PARTY-LICENSES.
# Reusable self-hosted Langfuse v3 OSS stack for Calibrated Agent Evaluation.
#
# Vendored from Langfuse's official OSS docker-compose (the unmodified MIT build), pinned to
# the `langfuse:3` major and run with TELEMETRY_ENABLED=false: an unmodified, telemetry-off
# deployment. It backs:
#   * the opt-in live integration test (tests/integration/test_langfuse_live.py), and
#   * `just seed-fixture langfuse` and `just flagship` runs against Langfuse.
#
# Calibrated Agent Evaluation does NOT fork or modify Langfuse: this compose stands up the stock
# image. Up/down via `just langfuse-up` / `just langfuse-down`. Topology mirrors the real OSS
# stack (web + worker + Postgres + Clickhouse + Redis + MinIO) so "unmodified deployment"
# is literally true and the Clickhouse-backed read paths are exercised.
#
# This stack is a loopback-only dev stack: every published port binds 127.0.0.1, so nothing here
# is reachable from another machine. This file holds no credential value. Each one is a required
# `${VAR:?...}` reference; `just langfuse-up` reads the throwaway dev values from .env.example (or
# from docker/langfuse/.env when you create one). Those values are obvious placeholders for this
# loopback dev stack only; any other deployment sets its own (`openssl rand -hex 32`).

services:
  langfuse-web:
    # langfuse/langfuse:3
    image: langfuse/langfuse@sha256:314f4d79d6761299e4299dc646943f01bfabbc1daff286ab818245549aa5e9d6
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment: &langfuse-env
      # --- OSS build, telemetry OFF (tech.md air-gap posture) ---
      TELEMETRY_ENABLED: "false"
      LANGFUSE_EE_LICENSE_KEY: ""               # no EE license → MIT/OSS surface only
      # --- datastores ---
      DATABASE_URL: postgresql://${POSTGRES_USER:?see docker/langfuse/.env.example}:${POSTGRES_PASSWORD:?see docker/langfuse/.env.example}@postgres:5432/postgres
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?see docker/langfuse/.env.example}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?see docker/langfuse/.env.example}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?see docker/langfuse/.env.example}
      # --- S3 / blob storage (MinIO) ---
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?see docker/langfuse/.env.example}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?see docker/langfuse/.env.example}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # --- app secrets ---
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?see docker/langfuse/.env.example}
      SALT: ${SALT:?see docker/langfuse/.env.example}
      # Langfuse validates this is 64 hex chars (`openssl rand -hex 32`).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?see docker/langfuse/.env.example}
      # --- auto-provision a dev org/project + API keys so the integration test can connect ---
      LANGFUSE_INIT_ORG_ID: calibrated-agent-evaluation-dev
      LANGFUSE_INIT_PROJECT_ID: calibrated-agent-evaluation-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?see docker/langfuse/.env.example}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?see docker/langfuse/.env.example}
      LANGFUSE_INIT_USER_EMAIL: dev@calibrated-agent-evaluation.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?see docker/langfuse/.env.example}
    healthcheck:
      # The langfuse/Next.js 16 server binds to the container's hostname interface, NOT
      # 127.0.0.1 — so a `localhost` probe gets "Connection refused" and the container is
      # marked unhealthy forever even though the app is fine (host reaches it via the port
      # map, and `wget http://$(hostname):3000` inside the container returns status OK).
      # Probe the hostname interface it actually listens on.
      test: ["CMD-SHELL", "wget -qO- http://$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  langfuse-worker:
    # langfuse/langfuse-worker:3
    image: langfuse/langfuse-worker@sha256:02c87eda9a9c6be5b3bf9a78041db86f06bad568d9dd434be3b3c1159f8d0579
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *langfuse-env

  postgres:
    # postgres:16-alpine
    image: postgres@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?see docker/langfuse/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see docker/langfuse/.env.example}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?see docker/langfuse/.env.example}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data

  clickhouse:
    # clickhouse/clickhouse-server:24.3
    image: clickhouse/clickhouse-server@sha256:85b97f63dcfff47790d26bb5d5801637aaddb2b93e5e9aee27a686c2fb2b9916
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?see docker/langfuse/.env.example}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?see docker/langfuse/.env.example}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

  redis:
    # redis:7-alpine
    image: redis@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?see docker/langfuse/.env.example}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:?see docker/langfuse/.env.example}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes minio/minio on Docker Hub; Chainguard's build is public and
    # ships the shell and `mc` the entrypoint and healthcheck below use.
    # cgr.dev/chainguard/minio:latest
    image: cgr.dev/chainguard/minio@sha256:16b824a0016ffad3dfa8b059755f83800aa42ca68fe86f1782cabd0c5a16d322
    # Create the langfuse bucket on startup so the langfuse-web S3 event-upload path works
    # out of the box (without this the OTel ingest endpoint 500s with NoSuchBucket — surfaced
    # by the live integration test against the real stack).
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?see docker/langfuse/.env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?see docker/langfuse/.env.example}
    ports:
      - "127.0.0.1:9090:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_minio:/data

volumes:
  langfuse_postgres:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio:
