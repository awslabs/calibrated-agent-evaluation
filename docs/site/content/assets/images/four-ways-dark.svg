<text x="436" y="436" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Tuned test set</text>
<rect x="550" y="304" width="40" height="96" fill="#f87171"/>
<text x="570" y="416" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">before</text>
<rect x="602" y="304" width="40" height="24" fill="#f87171"/>
<rect x="602" y="328" width="40" height="72" fill="#f87171" opacity="0.45"/>
<rect x="602" y="328" width="40" height="72" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="622" y="416" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">after</text>
<text x="596" y="436" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Production</text>
<text x="390" y="456" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start">Dashed: the same failures under a new name.</text>
</svg>
