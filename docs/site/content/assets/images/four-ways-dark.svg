<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 0 711 470" width="711" height="470" role="img" aria-labelledby="t d">
<title id="t">Four ways a judge's number misleads a team</title>
<desc id="d">One: real failures that the judge passes reach customers. Two: the judge reports about 15% failing when about 6% do. Three: a helpfulness score rises while refund-policy mistakes stay flat. Four: after a fix, failures drop on the tuned test set, while in production the same failures show up under another name.</desc>
<line x1="10" y1="20" x2="350" y2="20" stroke="#ece9f4" stroke-width="1.5"/>
<text x="10" y="44" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">It misses a failure</text>
<line x1="370" y1="20" x2="710" y2="20" stroke="#ece9f4" stroke-width="1.5"/>
<text x="370" y="44" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">It flags failures that aren't there</text>
<line x1="10" y1="250" x2="350" y2="250" stroke="#ece9f4" stroke-width="1.5"/>
<text x="10" y="274" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">A generic score hides it</text>
<line x1="370" y1="250" x2="710" y2="250" stroke="#ece9f4" stroke-width="1.5"/>
<text x="370" y="274" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">A fix works on the test set only</text>
<rect x="10" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="40" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="70" y="70" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="100" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="130" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="160" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="190" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="220" y="70" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="217" y="67" width="30" height="30" rx="3" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
<path d="M226 82 l4 5 l8 -10" stroke="#0f0d15" stroke-width="2.5" fill="none"/>
<rect x="250" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="280" y="70" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="10" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="40" y="102" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="70" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="100" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="130" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="160" y="102" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="157" y="99" width="30" height="30" rx="3" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
<path d="M166 114 l4 5 l8 -10" stroke="#0f0d15" stroke-width="2.5" fill="none"/>
<rect x="190" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="220" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<rect x="250" y="102" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="280" y="102" width="24" height="24" rx="2" fill="#34304a"/>
<text x="10" y="160" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Real failures the judge passed</text>
<text x="10" y="178" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">go out to customers.</text>
<rect x="390" y="80" width="70" height="90" fill="#f87171" opacity="1"/>
<text x="425" y="72" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">15%</text>
<text x="425" y="188" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Judge says</text>
<rect x="510" y="134" width="70" height="36" fill="#ece9f4" opacity="0.75"/>
<text x="545" y="126" fill="#ece9f4" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">6%</text>
<text x="545" y="188" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Really</text>
<line x1="380" y1="170" x2="640" y2="170" stroke="#34304a"/>
<line x1="20" y1="412" x2="290" y2="412" stroke="#34304a"/>
