<polyline points="20,390 74,393 128,390 182,393 236,390 290,393" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="296" y="295" fill="#2dd4bf" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">Helpfulness</text>
<text x="296" y="389" fill="#f87171" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">Refund</text>
<text x="296" y="403" fill="#f87171" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start">mistakes</text>
<text x="20" y="430" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">release by release</text>
<rect x="390" y="304" width="40" height="96" fill="#f87171"/>
<text x="410" y="416" fill="#a7a1b9" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">before</text>
<rect x="442" y="376" width="40" height="24" fill="#f87171"/>
