<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
<title id="t">Four ways a judge's number misleads a team</title>
<desc id="d">One: real failures that the judge passes reach customers. Two: the judge reports about 15% failing when about 6% do. Three: a helpfulness score rises while refund-policy mistakes stay flat. Four: after a fix, failures drop on the tuned test set, while in production the same failures show up under another name.</desc>
<line x1="10" y1="20" x2="350" y2="20" stroke="#1c2230" stroke-width="1.5"/>
<text x="10" y="44" fill="#1c2230" font-family="Source Serif 4, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="start">It misses a failure</text>
<line x1="370" y1="20" x2="710" y2="20" stroke="#1c2230" stroke-width="1.5"/>
<text x="370" y="44" fill="#1c2230" font-family="Source Serif 4, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="start">It flags failures that aren't there</text>
<line x1="10" y1="250" x2="350" y2="250" stroke="#1c2230" stroke-width="1.5"/>
<text x="10" y="274" fill="#1c2230" font-family="Source Serif 4, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="start">A generic score hides it</text>
<line x1="370" y1="250" x2="710" y2="250" stroke="#1c2230" stroke-width="1.5"/>
<text x="370" y="274" fill="#1c2230" font-family="Source Serif 4, Georgia, serif" font-size="14.5" font-weight="600" text-anchor="start">A fix works on the test set only</text>
