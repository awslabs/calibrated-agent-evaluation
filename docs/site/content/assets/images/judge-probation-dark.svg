<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 0 702 250" width="702" height="250" role="img" aria-labelledby="t d">
<title id="t">A judge on probation</title>
<desc id="d">The judge grades the same twelve runs your team labeled. It disagrees on two: it passes a real failure and flags a good run. Once it agrees often enough on a large enough sample, it is cleared to gate the build. Changing its model or prompt starts probation over.</desc>
